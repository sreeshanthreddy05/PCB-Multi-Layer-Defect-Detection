# PCB Defect Detection System Configuration

image:
  width: 640
  height: 640
  channels: 3

data:
  yaml_path: "data/pcb_defect.yaml"
  raw_dir: "data/raw/pcb-defect-dataset"
  splits_dir: "data/splits"
  seed: 42

model:
  architecture: "yolo11n"
  weights: "yolo11n.pt"
  checkpoint_dir: "runs/pcb_defect/baseline/weights"
  best_checkpoint: "runs/pcb_defect/baseline/weights/best.pt"
  num_classes: 6
  class_names:
    0: "mouse_bite"
    1: "spur"
    2: "missing_hole"
    3: "short"
    4: "open_circuit"
    5: "spurious_copper"

training:
  batch_size: 16
  epochs: 15
  imgsz: 640
  patience: 5
  seed: 42
  device: "0"
  workers: 0
  project: "runs/pcb_defect"
  name: "baseline"

inference:
  confidence_threshold: 0.25
  iou_threshold: 0.45

evaluation:
  metrics: ["precision", "recall", "mAP50", "mAP50_95", "latency"]
  report_dir: "outputs/reports"

logging:
  level: "INFO"
  log_dir: "outputs/reports"
